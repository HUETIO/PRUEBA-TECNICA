# ===========================================================================
# MANIFIESTO DE ENTREGA  --  OBLIGATORIO, en la raiz del zip
#
# El evaluador lee este archivo para saber como conectarse a tu solucion y
# que objetos revisar. Si falta o esta mal formado, los checks de seguridad
# no se pueden ejecutar y se califican en cero.
#
# Cuando termines de llenarlo, con la infra arriba:   make verificar
# Se conecta con los tres roles y busca los objetos que nombraste. No califica
# nada: solo te dice si el evaluador va a poder conectarse.
# ===========================================================================

candidato:
  nombre_completo: "Diego Alejandro Sepulveda Huetio"
  email: "Develop1998@outlook.es"
  horas_invertidas: 3          # se honesto, no afecta la nota

# Las credenciales de abajo son EFIMERAS y SOLO para evaluacion local.
# Deben ser las mismas que crea tu 'make up'.
postgres:
  host: localhost
  port: 5432
  database: bia_datos

  # Superusuario local. Lo necesitamos para verificar el CIFRADO EN REPOSO:
  # leer la tabla cruda es justamente lo que hace quien se roba un dump o
  # tiene acceso de DBA. Si no lo declaras, C3 no se puede verificar.
  superusuario:
    usuario: "postgres"
    password: <configurar-localmente>

  roles:
    ingesta:
      usuario: "rol_ingesta"
      password: <configurar-localmente>
    analista:
      usuario: "rol_analista"
      password: <configurar-localmente>
    auditor:
      usuario: "rol_auditor"
      password: <configurar-localmente>

# Nombres reales (con esquema) de los objetos que creaste.
objetos:
  tabla_consumos: "core.fact_consumo_horario"
  tabla_clientes: "core.dim_cliente"
  vista_analytics: "analytics.vw_consumo_mensual"
  tabla_auditoria: "core.audit_log"

# Opcional: marca en true lo que NO alcanzaste a hacer. Ser explicito sobre
# lo no hecho suma; que el evaluador lo descubra solo, resta.
no_implementado: []
